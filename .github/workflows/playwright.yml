name: Playwright Tests

'on':
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_spec:
        description: "Select spec file to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - tests/complex/complex.spec.js
          - tests/dom/shadowdom.spec.js
          - tests/fusion/fusion.spec.js
          - tests/iframe/iframe.spec.js
          - tests/multi-user/multi-user.spec.js
          - tests/network/network.spec.js
          - tests/smoke/smoke.spec.js
          - tests/xpath/xpath.spec.js
          - tests/chaos.spec.js
          - tests/har.spec.js
      browser:
        description: "Select browser"
        required: true
        default: all
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-pr:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        browser: [chromium]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-pr-${{ matrix.os }}-node${{ matrix.node }}-${{ matrix.browser }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-pr-${{ matrix.os }}-node${{ matrix.node }}-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

  test-nightly:
    if: github.event_name == 'schedule'
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Linux/macOS)
        if: runner.os != 'Windows'
        run: npx playwright install --with-deps

      - name: Install Playwright browsers (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-nightly-${{ matrix.os }}-node${{ matrix.node }}-${{ matrix.browser }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-nightly-${{ matrix.os }}-node${{ matrix.node }}-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

  test-manual:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Resolve test command
        id: scope
        shell: bash
        env:
          INPUT_TEST_SPEC: ${{ github.event.inputs.test_spec }}
          INPUT_BROWSER: ${{ github.event.inputs.browser }}
        run: |
          set -euo pipefail

          TEST_CMD="npx playwright test"
          if [[ -n "${INPUT_TEST_SPEC:-}" && "$INPUT_TEST_SPEC" != "all" ]]; then
            TEST_CMD="$TEST_CMD $INPUT_TEST_SPEC"
          fi
          if [[ -n "${INPUT_BROWSER:-}" && "$INPUT_BROWSER" != "all" ]]; then
            TEST_CMD="$TEST_CMD --project=$INPUT_BROWSER"
          fi

          echo "test_cmd=$TEST_CMD" >> "$GITHUB_OUTPUT"

      - name: Run Playwright tests
        shell: bash
        run: |
          echo "Running: ${{ steps.scope.outputs.test_cmd }}"
          ${{ steps.scope.outputs.test_cmd }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-manual
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-manual
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
