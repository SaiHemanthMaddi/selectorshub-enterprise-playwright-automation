name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  # id-token: write  <-- You can remove this if not using OIDC for other things

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Decide Test Scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          # We removed the Azure Service URL check here 
          # so it always runs locally on the runner
          BASE_CMD="npx playwright test"

          # ... (Keep your logic for changed files here) ...
          # Ensure you use $BASE_CMD without the "-c playwright.service.config.js"

      # REMOVED: Azure Login With Credentials
      # REMOVED: Azure Login With OIDC

      - name: Run Playwright tests
        if: steps.scope.outputs.run_tests == 'true'
        shell: bash
        run: |
          echo "Running local tests: ${{ steps.scope.outputs.test_cmd }}"
          ${{ steps.scope.outputs.test_cmd }}

      - name: Skip Note
        if: steps.scope.outputs.run_tests != 'true'
        run: |
          echo "Skipping Playwright run. Reason: ${{ steps.scope.outputs.reason }}"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.scope.outputs.run_tests == 'true' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30